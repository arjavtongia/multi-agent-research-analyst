[project]
name = "research-agents"
version = "0.1.0"
description = "A LangGraph team of LLM agents that researches a question on the open web and writes a fact-checked, cited report, with a human approval step."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arjav Tongia" }]
requires-python = ">=3.10"
keywords = ["langgraph", "agents", "llm", "research", "fact-checking", "human-in-the-loop"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "ddgs>=9.16.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langchain-core>=1.6.6",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.13",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "trafilatura>=2.3.0",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
research-agents = "research_agents.cli:main"

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.7.5"]
tavily = ["tavily-python>=0.8.4"]
ui = ["streamlit>=1.65.0"]
all = [
    "langchain-anthropic>=1.7.5",
    "tavily-python>=0.8.4",
    "streamlit>=1.65.0",
]

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]
